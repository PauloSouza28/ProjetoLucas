{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow p-4">

            <h2 class="mb-4 text-center">
                Criar Conta
            </h2>

            {% if erro %}

            <div class="alert alert-danger">
                {{ erro }}
            </div>

            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label>
                        Usuário
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label>
                        E-mail
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label>
                        Senha
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label>
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        name="confirmar"
                        class="form-control"
                        required
                    >

                </div>

                <button class="btn btn-success w-100">

                    Criar Conta

                </button>

            </form>

            <div class="text-center mt-3">

                <a href="/login/">
                    Já possui conta?
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
