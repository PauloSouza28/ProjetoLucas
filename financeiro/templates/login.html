{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow p-4">

            <h2 class="text-center mb-4">
                Login
            </h2>

            {% if erro %}

<div class="alert alert-danger">
    {{ erro }}
</div>

{% endif %}

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Usuário</label>

                    <input type="text"
                           name="username"
                           class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Senha</label>

                    <input type="password"
                           name="password"
                           class="form-control">
                </div>

                <button type="submit"
                        class="btn btn-success w-100">
                    Entrar
                </button>

                <a href="/cadastro/">
    Criar conta
</a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
