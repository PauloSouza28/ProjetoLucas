{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">
    Metas Financeiras
</h1>

<div class="card p-4 mb-4">

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-success">
            Criar Meta
        </button>

    </form>

</div>

<div class="row">

{% for meta in metas %}

<div class="col-md-6 mb-4">

    <div class="card p-4 shadow">

        <h4>{{ meta.nome }}</h4>

        <p>
            R$ {{ meta.valor_atual }}
            de
            R$ {{ meta.valor_meta }}
        </p>

        <div class="progress mb-3">

            <div
                class="progress-bar bg-success"
                style="width: {{ meta.porcentagem }}%;"
            >

                {{ meta.porcentagem }}%

            </div>

        </div>

        <div class="d-flex gap-2">

    <a
        href="/editar-meta/{{ meta.id }}/"
        class="btn btn-primary btn-sm"
    >
        Editar
    </a>

    <a
        href="/excluir-meta/{{ meta.id }}/"
        class="btn btn-danger btn-sm"
    >
        Excluir
    </a>

</div>

        <p>
            Prazo:
            {{ meta.prazo }}
        </p>

    </div>

</div>

{% endfor %}

</div>

{% endblock %}
